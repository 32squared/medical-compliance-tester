<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정답지 검토 — 나만의 주치의</title>
<style>
  :root {
    --bg:#0f172a; --surface:#1e293b; --surface2:#334155; --surface3:#3b4a63;
    --text:#e2e8f0; --text-dim:#94a3b8; --accent:#38bdf8; --accent-dim:#0c4a6e;
    --green:#22c55e; --red:#ef4444; --yellow:#eab308; --orange:#f97316; --purple:#a855f7;
    --border:#475569; --radius:12px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
         background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; font-size:14px; }
  .topbar { display:flex; align-items:center; gap:10px; padding:10px 20px; background:var(--surface);
            border-bottom:1px solid var(--border); flex-shrink:0; overflow:visible; }
  .nav-btn { background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:6px 12px;
             font-size:12px; font-weight:600; cursor:pointer; text-decoration:none; white-space:nowrap; }
  .nav-btn:hover { background:var(--surface2); color:var(--text); }
  .nav-btn.active { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
  .layout { flex:1; display:flex; overflow:hidden; }
  .sidebar { width:320px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
  .side-head { padding:12px 14px; border-bottom:1px solid var(--border); display:grid; gap:8px; }
  select, input[type=text], input[type=password], textarea { font:inherit; font-size:12px; color:var(--text); background:var(--bg);
             border:1px solid var(--border); border-radius:8px; padding:6px 8px; width:100%; }
  textarea { min-height:56px; resize:vertical; }
  .progress { font-size:12px; color:var(--text-dim); }
  .progress b { color:var(--text); }
  .pbar { height:4px; background:var(--surface2); border-radius:2px; overflow:hidden; }
  .pbar i { display:block; height:100%; background:var(--green); }
  .list { flex:1; overflow-y:auto; padding:6px; }
  .it { padding:8px 10px; border-radius:8px; cursor:pointer; border:1px solid transparent; display:flex; gap:8px; align-items:center; }
  .it:hover { background:var(--surface2); }
  .it.active { background:var(--accent-dim); border-color:var(--accent); }
  .it .sid { font-family:Consolas,monospace; font-size:12px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .done { color:var(--green); font-weight:700; width:14px; }
  .chip { font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:4px; white-space:nowrap; }
  .c-fail { background:#ef444422; color:#f87171; } .c-pass { background:#22c55e22; color:#4ade80; }
  .c-grade { background:var(--surface2); color:var(--text-dim); } .c-diff { background:#eab30822; color:#facc15; }
  .c-ai { background:#a855f722; color:#c084fc; } .c-aiok { background:var(--surface2); color:#a78bfa; }
  .ai { border-color:#a855f766; } .ai h3 { color:#c084fc; }
  .ai ul { margin:6px 0 0 18px; font-size:12.5px; line-height:1.6; }
  mark.ai-q { background:#a855f744; }
  .main { flex:1; overflow-y:auto; padding:18px 24px 80px; }
  .sec { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; }
  .sec h3 { font-size:13px; margin-bottom:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .sec h3 .hint { font-weight:400; font-size:11px; color:var(--text-dim); }
  .meta { font-size:12px; color:var(--text-dim); display:flex; gap:10px; flex-wrap:wrap; }
  .qtext { font-size:15px; font-weight:600; line-height:1.6; }
  .answer { white-space:pre-wrap; line-height:1.75; font-size:13.5px; max-height:520px; overflow-y:auto; }
  mark { background:#ef444455; color:var(--text); border-radius:3px; padding:0 2px; }
  .hit { border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; background:var(--bg); }
  .hit .q { margin:6px 0; padding:6px 10px; border-left:3px solid var(--red); background:#ef444411; font-size:13px; line-height:1.6; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th, td { padding:6px 8px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
  th { color:var(--text-dim); font-size:11px; white-space:nowrap; }
  .code { font-family:Consolas,monospace; white-space:nowrap; }
  .req { font-size:10px; color:var(--green); border:1px solid var(--green); border-radius:3px; padding:0 4px; margin-left:4px; }
  .seg { display:inline-flex; border:1px solid var(--border); border-radius:7px; overflow:hidden; }
  .seg button { background:none; border:none; color:var(--text-dim); font:inherit; font-size:11.5px; padding:4px 9px; cursor:pointer; }
  .seg button + button { border-left:1px solid var(--border); }
  .seg button.on.met, .seg button.on.pass { background:#22c55e33; color:#4ade80; font-weight:700; }
  .seg button.on.unmet, .seg button.on.fail { background:#ef444433; color:#f87171; font-weight:700; }
  .seg button.on.na { background:var(--surface3); color:var(--text); font-weight:700; }
  tr.changed td { background:#eab30812; }
  .rules { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:4px 12px; margin-top:8px; font-size:12px; }
  .rules label { display:flex; gap:6px; align-items:flex-start; cursor:pointer; }
  .rules label.judge { color:#f87171; font-weight:600; }
  details summary { cursor:pointer; color:var(--text-dim); font-size:12px; }
  pre { white-space:pre-wrap; font-size:11.5px; line-height:1.5; color:var(--text); background:var(--bg); padding:8px; border-radius:8px; max-height:360px; overflow:auto; }
  .savebar { position:sticky; bottom:0; display:flex; gap:10px; align-items:center; padding:12px 0 0; background:linear-gradient(transparent, var(--bg) 30%); }
  .btn { padding:8px 16px; border-radius:8px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; border:1px solid var(--border); background:var(--surface2); color:var(--text); }
  .btn.primary { background:var(--accent); color:#0f172a; border-color:var(--accent); }
  .btn:disabled { opacity:.5; cursor:default; }
  .kbd { font-size:11px; color:var(--text-dim); }
  .empty { padding:40px; color:var(--text-dim); text-align:center; line-height:1.8; }
  .err { color:#f87171; font-size:12px; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--border);
           padding:10px 18px; border-radius:10px; display:none; z-index:10; font-size:13px; }
  .modal-bg { position:fixed; inset:0; background:#0009; display:none; align-items:center; justify-content:center; z-index:9; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; width:min(560px,92vw); max-height:86vh; overflow:auto; }
  .stat { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin:10px 0; }
  .stat div { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 10px; }
  .stat b { display:block; font-size:18px; }
  .stat span { font-size:11px; color:var(--text-dim); }
  @media (max-width:820px) { .layout { flex-direction:column; } .sidebar { width:100%; max-height:40vh; } .main { padding:14px 16px 80px; } }
</style>
</head>
<body>
<div class="topbar">
  <h1 style="font-size:16px;font-weight:700;white-space:nowrap">&#127973; 나만의 주치의</h1>
  <nav id="appNav"></nav>
  <button class="nav-btn" id="statsBtn" style="display:none">일치율 보기</button>
  <a href="/api/eval-v3/labels/export" class="nav-btn" id="exportBtn" style="display:none">정답지 내보내기</a>
  <span id="userBadge" style="margin-left:auto;display:none;font-size:11px;color:var(--accent);background:var(--accent-dim);padding:3px 10px;border-radius:6px;white-space:nowrap"></span>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="side-head">
      <select id="runSel" aria-label="실행 선택"></select>
      <select id="filterSel" aria-label="목록 필터">
        <option value="ai">AI 검수: 사람 확인 필요</option>
        <option value="aiitem">AI 검수: 항목(PV·SV·UV) 이견</option>
        <option value="aiok">AI 검수: 문제 없음</option>
        <option value="all">전체</option>
        <option value="todo">검토 안 한 것</option>
        <option value="done">검토한 것</option>
        <option value="fail">판정기 법률 fail</option>
        <option value="diff">판정기와 다르게 라벨한 것</option>
      </select>
      <input type="text" id="searchBox" placeholder="문항 id 검색" aria-label="문항 id 검색">
      <div class="progress" id="progress"></div>
      <div class="pbar"><i id="pbar" style="width:0"></i></div>
    </div>
    <div class="list" id="list"><div class="empty">실행을 불러오는 중…</div></div>
  </div>
  <div class="main" id="main"><div class="empty">왼쪽에서 문항을 고르세요.<br><span class="kbd">J / K 다음·이전 · Ctrl+Enter 저장</span></div></div>
</div>

<div id="toast"></div>
<div class="modal-bg" id="statsBg"><div class="modal" id="statsBox"></div></div>
<div class="modal-bg" id="loginBg"><div class="modal">
  <h3 style="margin-bottom:10px">로그인</h3>
  <p class="kbd" style="margin-bottom:10px">테스터 계정으로 로그인하세요. 관리자는 <a href="/settings" style="color:var(--accent)">설정</a>에서 로그인합니다.</p>
  <input type="text" id="loginId" placeholder="ID" style="margin-bottom:8px">
  <input type="password" id="loginPw" placeholder="비밀번호" style="margin-bottom:8px">
  <div class="err" id="loginErr"></div>
  <button class="btn primary" id="loginBtn" style="margin-top:8px">로그인</button>
</div></div>

<script>
(function () {
  'use strict';
  var runs = [], runId = null, results = [], mine = {}, ai = {}, cur = null, curIdx = -1, isAdmin = false;
  var RULES = {};
  var ITEM_VALUES = [['met', '충족'], ['unmet', '미충족'], ['na', '해당 없음']];

  function $(id) { return document.getElementById(id); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function toast(m) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 2400); }
  function getJSON(url, opt) {
    return fetch(url, opt).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
  }
  function v3(r) { return (r && r.evalV3) || {}; }
  function judgeLegal(r) { var v = v3(r); return (v.judge_original && v.judge_original.legal_verdict) || v.legal_verdict; }

  // ── 인증 ──
  function initAuth() {
    return getJSON('/api/auth/status').then(function (a) {
      isAdmin = !!a.isAdmin;
      var b = $('userBadge');
      if (a.tester) { b.style.display = ''; b.textContent = '👤 ' + (a.tester.alias || a.tester.id || ''); }
      else if (a.isAdmin) { b.style.display = ''; b.textContent = '🛡️ 관리자'; }
      else { $('loginBg').style.display = 'flex'; return false; }
      if (isAdmin) { $('statsBtn').style.display = ''; $('exportBtn').style.display = ''; }
      return true;
    }).catch(function () { return true; });
  }
  $('loginBtn').onclick = function () {
    var id = $('loginId').value.trim(), pw = $('loginPw').value;
    if (!id || !pw) { $('loginErr').textContent = 'ID 와 비밀번호를 입력하세요'; return; }
    getJSON('/api/tester/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id, password: pw }) })
      .then(function () { location.reload(); }).catch(function (e) { $('loginErr').textContent = e.message || '로그인 실패'; });
  };

  // ── 실행·목록 ──
  function loadRuns() {
    return getJSON('/api/eval-v3/runs?limit=120').then(function (j) {
      runs = (j && j.runs) || [];
      var sel = $('runSel');
      sel.innerHTML = runs.map(function (r) {
        var n = (r.v3 && r.v3.n) || (r.summary && r.summary.total) || '';
        return '<option value="' + esc(r.runId) + '">' + esc(r.runId) + ' · ' + esc(n) + '건 · ' + esc((r.v3 && r.v3.ontology_version) || '') + '</option>';
      }).join('') || '<option value="">v3 판정이 있는 실행이 없습니다</option>';
      var want = decodeURIComponent((location.hash || '').replace(/^#/, '').split('/')[0]);
      var pick = runs.some(function (r) { return r.runId === want; }) ? want : (runs[0] && runs[0].runId);
      if (pick) { sel.value = pick; selectRun(pick); }
    }).catch(function (e) { $('list').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }
  function selectRun(id) {
    runId = id; results = []; mine = {}; ai = {}; cur = null; curIdx = -1;
    $('list').innerHTML = '<div class="empty">불러오는 중…</div>';
    $('main').innerHTML = '<div class="empty">왼쪽에서 문항을 고르세요.<br><span class="kbd">J / K 다음·이전 · Ctrl+Enter 저장</span></div>';
    return Promise.all([
      getJSON('/api/history/' + encodeURIComponent(id)),
      getJSON('/api/eval-v3/labels?run=' + encodeURIComponent(id)),
    ]).then(function (x) {
      results = ((x[0] && x[0].results) || []).filter(function (r) { var v = v3(r); return v && !v.error && v.legal_verdict; });
      ((x[1] && x[1].labels) || []).forEach(function (l) { mine[l.scenarioId] = l; });
      ((x[1] && x[1].ai) || []).forEach(function (a) { ai[a.scenarioId] = a; });
      // AI 검수가 끝난 실행이면 '사람 확인 필요' 목록부터 보여 준다. 검수가 없으면 전체.
      var hasAi = Object.keys(ai).length > 0, fs = $('filterSel');
      if (hasAi && !selectRun._touched) fs.value = 'ai';
      if (!hasAi && /^ai/.test(fs.value)) fs.value = 'all';
      renderList();
      var sid = decodeURIComponent((location.hash || '').split('/')[1] || '');
      if (sid) openItem(sid);
    }).catch(function (e) { $('list').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }
  function differs(r) {
    var l = mine[r.scenarioId]; if (!l) return false;
    return ((l.labels || {}).legal || {}).verdict !== judgeLegal(r);
  }
  function visible() {
    var f = $('filterSel').value, q = $('searchBox').value.trim().toLowerCase();
    return results.filter(function (r) {
      if (q && String(r.scenarioId).toLowerCase().indexOf(q) < 0) return false;
      if (f === 'todo') return !mine[r.scenarioId];
      if (f === 'done') return !!mine[r.scenarioId];
      if (f === 'fail') return judgeLegal(r) === 'fail';
      if (f === 'diff') return differs(r);
      if (f === 'ai') return !!(ai[r.scenarioId] && ai[r.scenarioId].needs_human);
      if (f === 'aiitem') return !!(ai[r.scenarioId] && ai[r.scenarioId].item_review);
      if (f === 'aiok') return !!(ai[r.scenarioId] && !ai[r.scenarioId].needs_human && !ai[r.scenarioId].item_review);
      return true;
    });
  }
  function renderList() {
    var vis = visible(), done = results.filter(function (r) { return mine[r.scenarioId]; }).length;
    var flagged = results.filter(function (r) { return ai[r.scenarioId] && ai[r.scenarioId].needs_human; });
    var fdone = flagged.filter(function (r) { return mine[r.scenarioId]; }).length;
    $('progress').innerHTML = (flagged.length ? '확인 필요 <b>' + fdone + '</b> / ' + flagged.length + '건 끝냄 · ' : '') +
      '내 라벨 <b>' + done + '</b> / ' + results.length + '건 · 목록 ' + vis.length + '건';
    $('pbar').style.width = (results.length ? done / results.length * 100 : 0) + '%';
    $('list').innerHTML = vis.map(function (r) {
      var v = v3(r), jl = judgeLegal(r), g = v.validity_grade || '-';
      return '<div class="it' + (cur && cur.scenarioId === r.scenarioId ? ' active' : '') + '" data-sid="' + esc(r.scenarioId) + '">' +
        '<span class="done">' + (mine[r.scenarioId] ? '✓' : '') + '</span>' +
        '<span class="sid">' + esc(r.scenarioId) + '</span>' +
        (differs(r) ? '<span class="chip c-diff">다름</span>' : '') +
        (ai[r.scenarioId] ? (ai[r.scenarioId].needs_human ? '<span class="chip c-ai">AI 확인</span>' : ai[r.scenarioId].item_review ? '<span class="chip c-aiok">항목 이견</span>' : '<span class="chip c-aiok">AI ✓</span>') : '') +
        '<span class="chip ' + (jl === 'fail' ? 'c-fail' : 'c-pass') + '">' + esc(jl) + '</span>' +
        '<span class="chip c-grade">' + esc(g) + '</span></div>';
    }).join('') || '<div class="empty">해당하는 문항이 없습니다</div>';
  }
  $('list').onclick = function (e) { var it = e.target.closest('.it'); if (it) openItem(it.getAttribute('data-sid')); };
  $('runSel').onchange = function () { location.hash = encodeURIComponent(this.value); selectRun(this.value); };
  $('filterSel').onchange = function () { selectRun._touched = true; renderList(); };
  $('searchBox').oninput = renderList;

  // ── 1건 ──
  function openItem(sid) {
    location.hash = encodeURIComponent(runId) + '/' + encodeURIComponent(sid);
    $('main').innerHTML = '<div class="empty">불러오는 중…</div>';
    getJSON('/api/eval-v3/review-item?run=' + encodeURIComponent(runId) + '&sid=' + encodeURIComponent(sid)).then(function (j) {
      RULES = j.rules || RULES;
      cur = j.result; cur._judge = j.judge; cur._case = j.case; cur._label = (j.labels || [])[0] || null; cur._ai = (j.aiLabels || [])[0] || null;
      curIdx = visible().findIndex(function (r) { return r.scenarioId === sid; });
      renderList(); renderItem();
      var a = document.querySelector('.it.active'); if (a) a.scrollIntoView({ block: 'nearest' });
    }).catch(function (e) { $('main').innerHTML = '<div class="empty err">' + esc(e.message) + '</div>'; });
  }
  function ruleName(id) { return (RULES[id] && RULES[id].title) || ''; }
  // 판정기 문장(빨강)을 표시한 뒤 AI 검수 문장(보라)을 표시 — 같은 문장이면 겹쳐 보인다
  function highlight(text, quotes, aiQuotes) {
    var h = esc(text);
    function mark(list, cls) {
      (list || []).filter(Boolean).sort(function (a, b) { return b.length - a.length; }).forEach(function (q) {
        var e = esc(q.trim()); if (e.length < 4) return;
        h = h.split(e).join('<mark' + cls + '>' + e + '</mark>');
      });
    }
    mark(quotes, ''); mark(aiQuotes, ' class="ai-q"');
    return h;
  }
  function aiHtml(A, am, al, jd) {
    var lg = al.legal || {}, same = lg.verdict === jd.legal_verdict;
    var items = Object.keys(al.items || {}).filter(function (k) { return (jd.items || {})[k] && (jd.items || {})[k] !== al.items[k]; });
    return '<div class="sec ai"><h3>AI 검수 의견<span class="hint">' + esc(A.labelerName || A.labelerId) + ' · 확신 ' + esc(am.confidence || '-') + '</span>' +
      (am.needs_human ? '<span class="chip c-ai">사람 확인 필요</span>' : '<span class="chip c-aiok">법률 판단 판정기와 같음</span>') + (am.item_review ? '<span class="chip c-aiok">항목 이견</span>' : '') +
      '<button type="button" class="btn" id="useAiBtn" style="margin-left:auto">AI 의견으로 폼 채우기</button></h3>' +
      '<div class="meta"><span>법률 <b class="' + (lg.verdict === 'fail' ? 'err' : '') + '">' + esc(lg.verdict) + '</b> ' + esc((lg.rules || []).join(', ')) + '</span>' +
      '<span>판정기 ' + esc(jd.legal_verdict) + ' ' + esc((jd.legal_hits || []).join(', ')) + (same ? ' (같음)' : ' (다름)') + '</span>' +
      (am.quotes_ok === false ? '<span class="err">AI 인용 문장이 답변에 없음</span>' : '') +
      ((am.review_rules || []).length || (am.judge_review_hits || []).length ? '<span>검토 규칙(법무 회신 대기) AI ' + esc((am.review_rules || []).join(', ') || '없음') + ' · 판정기 ' + esc((am.judge_review_hits || []).join(', ') || '없음') + '</span>' : '') + '</div>' +
      (lg.note ? '<p style="margin-top:8px;font-size:13px;line-height:1.6">' + esc(lg.note) + '</p>' : '') +
      ((am.reasons || []).length ? '<div class="kbd" style="margin-top:6px">사람에게 넘긴 이유</div><ul>' + am.reasons.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') +
      ((am.judge_errors || []).length ? '<div class="kbd" style="margin-top:6px">AI 가 본 판정기 오류</div><ul>' + am.judge_errors.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') +
      (items.length ? '<table style="margin-top:8px"><tr><th>판정기와 다른 항목</th><th>판정기</th><th>AI</th><th>AI 이유</th></tr>' + items.map(function (k) {
        return '<tr><td class="code">' + esc(k) + ' ' + esc(ruleName(k)) + '</td><td class="code">' + esc(jd.items[k]) + '</td><td class="code">' + esc(al.items[k]) + '</td><td>' + esc((am.item_reasons || {})[k] || '') + '</td></tr>';
      }).join('') + '</table>' : '') + '</div>';
  }
  function hitHtml(h) {
    var ev = (h.evidence || []).map(function (e) {
      return '<tr><td class="code">' + esc(e.basis || e.kind || '') + '</td><td class="code">' + esc(e.phrase_id || e.id || e.rule_id || '') + '</td>' +
        '<td>' + esc(e.text || e.phrase || '') + '</td><td>' + esc(e.person_attributed == null ? '' : (e.person_attributed ? '사람 귀속' : '비귀속')) +
        (e.attrib_level ? ' · ' + esc(e.attrib_level) : '') + '</td><td>' + esc(e.rationale || '') + '</td></tr>';
    }).join('');
    return '<div class="hit"><div class="meta"><b class="code" style="color:#f87171">' + esc(h.rule_id) + '</b><span>' + esc(ruleName(h.rule_id)) + '</span>' +
      (h.level ? '<span>수준 ' + esc(h.level) + '</span>' : '') + (h.status ? '<span>' + esc(h.status) + '</span>' : '') +
      (h.decision ? '<span>결정 ' + esc(typeof h.decision === 'string' ? h.decision : JSON.stringify(h.decision)) + '</span>' : '') +
      (h.detectors ? '<span>검출 ' + esc([].concat(h.detectors).join(', ')) + '</span>' : '') + '</div>' +
      (h.quote ? '<div class="q">' + esc(h.quote) + '</div>' : '<div class="kbd">걸린 문장이 저장되지 않은 실행입니다(0단계 이전).</div>') +
      (ev ? '<details><summary>판정 근거 ' + (h.evidence || []).length + '개</summary><table><tr><th>근거</th><th>문구 id</th><th>문구</th><th>귀속</th><th>이유</th></tr>' + ev + '</table></details>' : '') +
      '</div>';
  }
  function caseHtml(c) {
    if (!c) return '<div class="kbd">연결된 PHR 기록이 없습니다(증상 문항이거나 케이스를 찾지 못함).</div>';
    return Object.keys(c).map(function (k) {
      var v = c[k], n = Array.isArray(v) ? v.length + '건' : (v && typeof v === 'object' ? Object.keys(v).length + '항목' : '');
      return '<details><summary>' + esc(k) + ' ' + esc(n) + '</summary><pre>' + esc(JSON.stringify(v, null, 1)) + '</pre></details>';
    }).join('');
  }
  function renderItem() {
    var r = cur, v = v3(r), jd = r._judge || {}, lab = (r._label && r._label.labels) || null;
    var hits = v.legal_hit_detail || [];
    var quotes = hits.map(function (h) { return h.quote; });
    var A = r._ai, am = (A && A.meta) || {}, al = (A && A.labels) || {};
    var aiQuotes = (am.quotes || []).map(function (q) { return q.quote; });
    var items = (v.validity_items || []).concat(v.uv_items || []);
    var legalDefault = lab ? lab.legal.verdict : jd.legal_verdict;
    var rulesDefault = lab ? lab.legal.rules : (jd.legal_verdict === 'fail' ? jd.legal_hits : []);
    var html = '';
    html += '<div class="sec"><h3>' + esc(r.scenarioId) + '<span class="hint">' + esc(r.category || '') + ' · ' + esc(r.phrCaseId || '증상') +
      ' · 온톨로지 ' + esc(jd.ontology_version || '-') + ' · ' + esc(jd.judge_model || '') + '</span></h3>' +
      '<div class="meta"><span>판정기 법률 <b class="' + (jd.legal_verdict === 'fail' ? 'err' : '') + '">' + esc(jd.legal_verdict) + '</b> ' + esc((jd.legal_hits || []).join(', ')) + '</span>' +
      (jd.human_review ? '<span>기존 사람 검토 ' + esc(jd.human_review) + '</span>' : '') +
      '<span>' + esc(v.validity_axis || '') + ' ' + esc(v.validity_grade || '-') + '</span><span>UV ' + esc(v.uv_grade || '-') + ' (' + esc(v.uv_intent || '의도 미분류') + ')</span></div>' +
      '<p class="qtext" style="margin-top:10px">' + esc(r.prompt) + '</p>' +
      (r.expectedBehavior ? '<details style="margin-top:8px"><summary>기대 동작</summary><pre>' + esc(r.expectedBehavior) + '</pre></details>' : '') + '</div>';
    if (A) html += aiHtml(A, am, al, jd);
    html += '<div class="sec"><h3>답변<span class="hint">빨간 표시 = 판정기가 걸었던 문장' + (aiQuotes.length ? ' · 보라 = AI 검수가 위반으로 본 문장' : '') + '</span></h3><div class="answer">' + highlight(r.response || '', quotes, aiQuotes) + '</div></div>';
    html += '<div class="sec"><h3>판정기가 걸은 규칙 ' + hits.length + '건</h3>' + (hits.map(hitHtml).join('') || '<div class="kbd">없음</div>') + '</div>';
    html += '<div class="sec"><h3>PHR 기록</h3>' + caseHtml(r._case) + '</div>';
    // 라벨 폼
    var allLG = Object.keys(RULES).filter(function (k) { return /^LG-/.test(k); }).sort();
    html += '<div class="sec" id="form"><h3>내 라벨' + (r._label ? '<span class="hint">저장됨 ' + esc(new Date(r._label.updatedAt || 0).toLocaleString('ko-KR')) + '</span>' : '<span class="hint">판정기 값으로 채워 두었습니다 — 판정기와 다른 것만 바꾸세요</span>') + '</h3>' +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>법률</b>' + seg('legal', [['pass', 'pass'], ['fail', 'fail']], legalDefault) + '</div>' +
      '<div class="rules" id="ruleBox">' + allLG.map(function (k) {
        var on = (rulesDefault || []).indexOf(k) >= 0, j = (jd.legal_hits || []).indexOf(k) >= 0;
        return '<label class="' + (j ? 'judge' : '') + '"><input type="checkbox" value="' + k + '"' + (on ? ' checked' : '') + '><span><span class="code">' + k + '</span> ' + esc(ruleName(k)) + '</span></label>';
      }).join('') + '</div>' +
      '<input type="text" id="legalNote" placeholder="법률 판단 이유 (예: 기록된 판정을 그대로 전함 — L3)" style="margin-top:8px" value="' + esc(lab ? lab.legal.note : '') + '">' +
      '<table style="margin-top:12px"><tr><th>항목</th><th>확인하는 것</th><th>판정기</th><th>판정기 설명</th><th>내 라벨</th></tr>' +
      items.map(function (it) {
        var jv = it.result, mv = lab ? (lab.items || {})[it.id] : (['met', 'unmet', 'na'].indexOf(jv) >= 0 ? jv : null);
        var req = RULES[it.id] && RULES[it.id].required;
        return '<tr data-item="' + esc(it.id) + '" data-judge="' + esc(jv) + '"' + (mv && mv !== jv ? ' class="changed"' : '') + '><td class="code">' + esc(it.id) + (req ? '<span class="req">필수</span>' : '') + '</td>' +
          '<td>' + esc(ruleName(it.id)) + '</td><td class="code">' + esc(jv) + '</td><td>' + esc(typeof it.detail === 'string' ? it.detail : (it.detail ? JSON.stringify(it.detail) : '')) + '</td>' +
          '<td>' + seg('item:' + it.id, ITEM_VALUES, mv) + '</td></tr>';
      }).join('') + '</table>' +
      '<textarea id="note" placeholder="메모 (판정기 오류 유형, 기준이 애매한 점 등)" style="margin-top:10px">' + esc(r._label ? r._label.note : '') + '</textarea>' +
      '<div class="savebar"><button class="btn primary" id="saveBtn">저장하고 다음 (Ctrl+Enter)</button><button class="btn" id="prevBtn">이전 (K)</button><button class="btn" id="nextBtn">다음 (J)</button>' +
      '<span class="err" id="saveErr"></span></div></div>';
    $('main').innerHTML = html; $('main').scrollTop = 0;
    if ($('useAiBtn')) $('useAiBtn').onclick = function () { fillForm(al); toast('AI 의견으로 채웠습니다 — 확인 후 저장하세요'); };
    $('saveBtn').onclick = save; $('prevBtn').onclick = function () { move(-1); }; $('nextBtn').onclick = function () { move(1); };
  }
  function setSeg(name, val) {
    var s = document.querySelector('.seg[data-name="' + name + '"]'); if (!s) return;
    [].forEach.call(s.children, function (x) { x.classList.toggle('on', x.getAttribute('data-v') === val); });
    var tr = s.closest('tr[data-item]');
    if (tr) tr.classList.toggle('changed', !!val && val !== tr.getAttribute('data-judge'));
  }
  function fillForm(l) {
    var lg = (l && l.legal) || {};
    setSeg('legal', lg.verdict);
    [].forEach.call(document.querySelectorAll('#ruleBox input'), function (c) { c.checked = (lg.rules || []).indexOf(c.value) >= 0; });
    if (lg.note) $('legalNote').value = lg.note;
    Object.keys((l && l.items) || {}).forEach(function (k) { setSeg('item:' + k, l.items[k]); });
  }
  function seg(name, opts, val) {
    return '<span class="seg" data-name="' + esc(name) + '">' + opts.map(function (o) {
      return '<button type="button" class="' + o[0] + (val === o[0] ? ' on' : '') + '" data-v="' + o[0] + '">' + esc(o[1]) + '</button>';
    }).join('') + '</span>';
  }
  $('main').addEventListener('click', function (e) {
    var b = e.target.closest('.seg button'); if (!b) return;
    var s = b.parentNode, on = b.classList.contains('on');
    [].forEach.call(s.children, function (x) { x.classList.remove('on'); });
    if (!on) b.classList.add('on');
    var tr = s.closest('tr[data-item]');
    if (tr) tr.classList.toggle('changed', !!(s.querySelector('.on') && s.querySelector('.on').getAttribute('data-v') !== tr.getAttribute('data-judge')));
    if (s.getAttribute('data-name') === 'legal' && !on && b.getAttribute('data-v') === 'pass') {
      [].forEach.call(document.querySelectorAll('#ruleBox input'), function (c) { c.checked = false; });
    }
  });
  function segVal(name) {
    var s = document.querySelector('.seg[data-name="' + name + '"] .on');
    return s ? s.getAttribute('data-v') : null;
  }
  function save() {
    if (!cur) return;
    var legal = segVal('legal'), rules = [].map.call(document.querySelectorAll('#ruleBox input:checked'), function (c) { return c.value; });
    var items = {};
    [].forEach.call(document.querySelectorAll('tr[data-item]'), function (tr) {
      var id = tr.getAttribute('data-item'), v = segVal('item:' + id); if (v) items[id] = v;
    });
    if (!legal) { $('saveErr').textContent = '법률 pass/fail 을 고르세요'; return; }
    if (legal === 'fail' && !rules.length) { $('saveErr').textContent = 'fail 이면 걸린 규칙을 하나 이상 고르세요'; return; }
    $('saveBtn').disabled = true; $('saveErr').textContent = '';
    getJSON('/api/eval-v3/labels', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
      runId: runId, scenarioId: cur.scenarioId, note: $('note').value,
      labels: { legal: { verdict: legal, rules: legal === 'fail' ? rules : [], note: $('legalNote').value }, items: items } }) })
      .then(function (j) {
        mine[cur.scenarioId] = { scenarioId: cur.scenarioId, labels: j.labels };
        toast('저장했습니다 · ' + cur.scenarioId); move(1, true);
      }).catch(function (e) { $('saveErr').textContent = e.message; $('saveBtn').disabled = false; });
  }
  function move(d, afterSave) {
    var vis = visible();
    if (!vis.length) { renderList(); return; }
    var i = cur ? vis.findIndex(function (r) { return r.scenarioId === cur.scenarioId; }) : -1;
    // '검토 안 한 것' 목록에서 저장하면 방금 건이 빠지므로 같은 자리가 다음 건이다
    var n = i < 0 ? (afterSave ? curIdx : 0) : i + d;
    if (n >= vis.length || n < 0) { renderList(); toast(d > 0 ? '목록 끝입니다' : '목록 처음입니다'); if (afterSave) renderItem(); return; }
    openItem(vis[n].scenarioId);
  }
  document.addEventListener('keydown', function (e) {
    var t = (e.target.tagName || '').toLowerCase();
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); save(); return; }
    if (t === 'input' || t === 'textarea' || t === 'select') return;
    if (e.key === 'j') move(1); else if (e.key === 'k') move(-1);
  });

  // ── 일치율 (Admin) ──
  $('statsBtn').onclick = function () {
    getJSON('/api/eval-v3/labels?all=1&run=' + encodeURIComponent(runId || '')).then(function (j) {
      var s = j.stats || {}, L = s.legal || {}, I = s.items || {}, C = s.cross || {};
      function p(x) { return x == null ? '-' : (x * 100).toFixed(0) + '%'; }
      var rows = Object.keys(I.by_id || {}).map(function (k) { var x = I.by_id[k]; return '<tr><td class="code">' + esc(k) + '</td><td>' + esc(ruleName(k)) + '</td><td>' + x.n + '</td><td>' + p(x.agree) + '</td></tr>'; }).join('');
      $('statsBox').innerHTML = '<h3>판정기 대비 일치율 · ' + esc(runId) + '</h3><p class="kbd">사람 라벨을 정답으로 봅니다. 검토자 전원 라벨 ' + s.n + '행, 문항 ' + s.items_labeled + '건.</p>' +
        '<div class="stat"><div><b>' + p(L.precision) + '</b><span>LG 정밀도 (판정기 fail 중 진짜)</span></div><div><b>' + p(L.recall) + '</b><span>LG 재현율 (진짜 fail 중 잡은 것)</span></div>' +
        '<div><b>' + p(I.agree) + '</b><span>항목 일치 (' + (I.n || 0) + '개)</span></div><div><b>' + p(C.legal_agree) + '</b><span>검토자 간 법률 일치 (' + (C.pairs || 0) + '건)</span></div></div>' +
        '<p class="kbd">LG: 진짜 fail ' + L.tp + ' · 거짓 fail ' + L.fp + ' · 놓친 fail ' + L.fn + ' · 정상 pass ' + L.tn + '</p>' +
        (rows ? '<table style="margin-top:10px"><tr><th>항목</th><th></th><th>n</th><th>일치</th></tr>' + rows + '</table>' : '') +
        '<button class="btn" style="margin-top:12px" onclick="document.getElementById(\'statsBg\').style.display=\'none\'">닫기</button>';
      $('statsBg').style.display = 'flex';
    }).catch(function (e) { toast(e.message); });
  };
  $('statsBg').onclick = function (e) { if (e.target === this) this.style.display = 'none'; };

  initAuth().then(function (ok) { if (ok) loadRuns(); });
})();
</script>
<script src="/app_nav.js"></script>
</body>
</html>
