# Host repo CI — medical-compliance-tester (RAG 분리 후 호스트 전용 repo)
# D6 결정: CI only (GitHub Actions). 배포는 PowerShell 수동 유지.
# trigger: push / PR on master or refactor/** branches.
#
# jobs:
#   lint   — check_no_cross_import(--forbid rag/eval) + py_compile + js-syntax
#   pytest — 호스트 안정 테스트 (DB/서버/키 불필요)
#
# ※ 서브모듈 두 개를 쓴다.
#    - packages/medical_shared (medical-shared) — **공개** repo. 토큰 없이 받는다. 필수.
#    - packages/medical_eval   (medical-eval)   — **비공개** repo. 워크플로 기본 GITHUB_TOKEN 은
#      다른 repo 를 못 읽으므로 clone 이 실패한다. repo Secrets 에 읽기 권한 PAT 를
#      EVAL_REPO_TOKEN 으로 넣으면 받아온다. 없으면 받지 않고 넘어가며, 이때
#      v3 어댑터 판정 테스트만 skip 된다(경계검사·py_compile·나머지 테스트는 그대로 돈다).

name: CI

on:
  push:
    branches:
      - master
      - "refactor/**"
  pull_request:
    branches:
      - master
      - "refactor/**"

jobs:
  # ── job (a): 경계검사 + 컴파일 + JS 문법 ───────────────────────────────────
  lint:
    name: "host-lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false          # 아래 단계에서 직접 받는다(비공개 medical_eval 실패 허용)

      - name: Submodules — medical_shared 필수 / medical_eval 선택
        env:
          EVAL_REPO_TOKEN: ${{ secrets.EVAL_REPO_TOKEN }}
        run: |
          git submodule update --init --depth 1 packages/medical_shared
          if [ -n "$EVAL_REPO_TOKEN" ]; then
            git config --global url."https://x-access-token:$EVAL_REPO_TOKEN@github.com/".insteadOf "https://github.com/"
          fi
          git submodule update --init --depth 1 packages/medical_eval \
            || echo "::notice::medical_eval 미획득(비공개 repo, EVAL_REPO_TOKEN 미설정) — v3 어댑터 테스트는 skip 된다"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js (js-syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install shared package (submodule)
        run: |
          pip install --quiet -e "packages/medical_shared" 2>/dev/null || true

      - name: Boundary — 호스트가 RAG 모듈을 import 하지 않음
        run: python scripts/check_no_cross_import.py --forbid rag

      - name: Boundary — v3 판정기는 eval_v3.py 어댑터로만 부른다
        run: python scripts/check_no_cross_import.py --forbid eval

      - name: py_compile — 루트 + tests + scripts + packages
        run: |
          python - <<'PYEOF'
          import py_compile, glob, os, sys
          targets = (sorted(glob.glob("*.py")) + sorted(glob.glob("tests/*.py"))
              + sorted(glob.glob("scripts/*.py"))
              + sorted(glob.glob("packages/**/*.py", recursive=True)))
          bad = 0
          for p in targets:
              try:
                  py_compile.compile(p, doraise=True)
              except Exception as e:
                  print(f"ERR {p}: {e}"); bad += 1
          print(f"py_compile: {len(targets)} files, {bad} errors")
          sys.exit(1 if bad else 0)
          PYEOF

      - name: v3 UI — 이력 화면 렌더 로직 (교차표·배지)
        run: node scripts/check_v3_ui.js

      - name: JS syntax — HTML 인라인 스크립트
        run: |
          node -e "const fs=require('fs');const files=fs.readdirSync('.').filter(f=>f.endsWith('.html'));let bad=0;for(const f of files){const html=fs.readFileSync(f,'utf8');const m=html.match(/<script>([\s\S]*?)<\/script>/g)||[];for(const t of m){const c=t.replace(/<\/?script>/g,'');if(c.length<500)continue;try{new Function(c)}catch(e){console.log(f+': '+e.message);bad++}}}console.log('js-syntax checked '+files.length+' html, '+bad+' errors');process.exit(bad?1:0)"

  # ── job (b): pytest — 호스트 안정 테스트 ──────────────────────────────────
  # PASS (포함):
  #   test_guardrail_false_positives — ComplianceAnalyzer(shim) 정규식, DB 불필요
  #   test_rag_consultation_eval     — 호스트 rag_consultation_eval 프롬프트 빌더, 키/네트워크 불필요
  #   test_rag_legal_eval            — 호스트 rag_legal_eval 프롬프트 빌더, 키/네트워크 불필요
  #   test_rlhf_db                   — SQLite 임시파일 DB, DATABASE_URL='' 강제
#   test_eval_v3_adapter           — eval_v3 어댑터 + run_rag PHR 주입. 판정 모델 stub, 키 불필요
#                                    (packages/medical_eval 미초기화 시 통째로 skip)
  #
  # EXCLUDED (서버/키 필요):
  #   test_rag_kb_api / test_phase1_integration / test_rlhf_api — 로컬 서버 기동 필요
  #   verify_rag_separation — 라이브 RAG URL 필요한 직접 실행 하니스
  pytest:
    name: "host-pytest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false          # 아래 단계에서 직접 받는다(비공개 medical_eval 실패 허용)

      - name: Submodules — medical_shared 필수 / medical_eval 선택
        env:
          EVAL_REPO_TOKEN: ${{ secrets.EVAL_REPO_TOKEN }}
        run: |
          git submodule update --init --depth 1 packages/medical_shared
          if [ -n "$EVAL_REPO_TOKEN" ]; then
            git config --global url."https://x-access-token:$EVAL_REPO_TOKEN@github.com/".insteadOf "https://github.com/"
          fi
          git submodule update --init --depth 1 packages/medical_eval \
            || echo "::notice::medical_eval 미획득(비공개 repo, EVAL_REPO_TOKEN 미설정) — v3 어댑터 테스트는 skip 된다"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          pip install --quiet pytest
          pip install --quiet -e "packages/medical_shared" 2>/dev/null || true

      - name: Run host-stable tests
        env:
          DATABASE_URL: ""
        run: |
          python -m pytest \
            tests/test_guardrail_false_positives.py \
            tests/test_rag_consultation_eval.py \
            tests/test_rag_legal_eval.py \
            tests/test_rlhf_db.py \
            tests/test_eval_v3_adapter.py \
            -v --tb=short -q
