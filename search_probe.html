<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🔍 End Point 검색 결과 검증 도구 (Admin)</title>
<style>
:root {
  --primary: #0ea5e9;
  --accent: #6366f1;
  --green: #22c55e;
  --yellow: #eab308;
  --red: #ef4444;
  --bg: #0f172a;
  --surface: #1e293b;
  --surface2: #334155;
  --border: #334155;
  --text: #f1f5f9;
  --text-dim: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; }
.page { max-width: 1200px; margin: 0 auto; padding: 24px; }
.header { border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.header h1 { font-size: 22px; font-weight: 700; }
.header .sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.nav { display: flex; gap: 10px; margin-bottom: 16px; font-size: 12px; }
.nav a { color: var(--text-dim); text-decoration: none; padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px; }
.nav a:hover { color: var(--accent); border-color: var(--accent); }

.input-section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.input-section label { display: block; font-size: 12px; font-weight: 700; color: var(--text-dim); margin-bottom: 4px; }
textarea { width: 100%; min-height: 80px; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-family: inherit; font-size: 14px; resize: vertical; }
textarea:focus { outline: none; border-color: var(--accent); }

.option-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.option-row select, .option-row input[type=text] { padding: 6px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-size: 12px; }
.checkbox-group { display: flex; gap: 12px; align-items: center; }
.checkbox-group label { display: flex; gap: 6px; align-items: center; font-size: 12px; cursor: pointer; }
.checkbox-group input[type=checkbox] { accent-color: var(--accent); }

.btn-run { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 10px 24px; font-size: 14px; font-weight: 700; cursor: pointer; }
.btn-run:hover { background: #7c3aed; }
.btn-run:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
.btn-secondary:hover { background: var(--border); }

.status { padding: 10px 14px; border-radius: 6px; margin: 12px 0; font-size: 13px; }
.status.loading { background: rgba(99, 102, 241, 0.15); border: 1px solid var(--accent); color: var(--accent); }
.status.success { background: rgba(34, 197, 94, 0.15); border: 1px solid var(--green); color: var(--green); }
.status.error { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--red); color: var(--red); }

.results-section { display: none; margin-top: 16px; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 16px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px; text-align: center; }
.kpi-value { font-size: 22px; font-weight: 800; }
.kpi-label { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

.section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 14px; }
.section h2 { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.section h2 small { font-size: 11px; color: var(--text-dim); font-weight: 400; }

.config-row { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--text-dim); }
.config-row span { padding: 2px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 3px; }
.config-row b { color: var(--text); }

.response-text { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 12px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; max-height: 400px; overflow-y: auto; color: var(--text); }

.search-card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 10px; font-size: 13px; }
.search-card .sc-header { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
.search-card .sc-num { font-weight: 700; color: var(--accent); min-width: 24px; }
.search-card .sc-title { font-weight: 700; color: var(--text); flex: 1; }
.search-card .sc-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
.search-card .sc-meta span { margin-right: 8px; }
.search-card .sc-abstract { font-size: 12px; line-height: 1.55; color: var(--text-dim); margin-top: 6px; padding: 6px 8px; background: var(--surface); border-radius: 3px; max-height: 100px; overflow-y: auto; }
.search-card .sc-link { font-size: 11px; color: var(--accent); text-decoration: none; }
.search-card .sc-link:hover { text-decoration: underline; }
.source-pill { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 700; }
.source-pill.PUBMED { background: rgba(34, 197, 94, 0.2); color: var(--green); }
.source-pill.WEB { background: rgba(14, 165, 233, 0.2); color: var(--primary); }
.source-pill.OTHER { background: var(--surface2); color: var(--text-dim); }

.raw-json { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 12px; font-family: 'Menlo','Consolas',monospace; font-size: 11.5px; line-height: 1.5; max-height: 500px; overflow: auto; color: var(--text); white-space: pre; }
details > summary { cursor: pointer; padding: 6px 0; font-size: 12px; color: var(--text-dim); }
details > summary:hover { color: var(--accent); }

.empty { padding: 20px; text-align: center; color: var(--text-dim); font-size: 13px; }
</style>
</head>
<body>

<div class="page">
  <div class="nav">
    <a href="/">🏠 채팅 테스터</a>
    <a href="/manager">📋 시나리오</a>
    <a href="/history">📊 이력</a>
    <a href="/settings">⚙️ 설정</a>
  </div>

  <div class="header">
    <h1>🔍 End Point 검색 결과 검증 도구</h1>
    <div class="sub">Admin 전용 · End Point 직접 호출 + search_results 구조·인용 면수 raw 검증 (정식 사용자 기능 아님)</div>
  </div>

  <!-- 입력 영역 -->
  <div class="input-section">
    <label>질의(Query)</label>
    <textarea id="queryInput" placeholder="예) 고혈압 환자가 두통이 심할 때 어떻게 해야 하나요?"></textarea>

    <div class="option-row">
      <div>
        <label style="display:inline">환경</label>
        <select id="envSelect">
          <option value="">현재 설정 사용</option>
          <option value="prod">prod</option>
          <option value="stg">stg</option>
          <option value="dev">dev</option>
        </select>
      </div>
      <div class="checkbox-group">
        <span style="font-size:12px;color:var(--text-dim);font-weight:700">소스:</span>
        <label><input type="checkbox" id="srcWeb"> WEB</label>
        <label><input type="checkbox" id="srcPubmed" checked> PUBMED</label>
      </div>
      <div>
        <label style="display:inline">Graph Type</label>
        <input type="text" id="graphType" placeholder="ORCHESTRATED_HYBRID_SEARCH" style="width:240px">
      </div>
      <button class="btn-run" id="btnRun" onclick="runProbe()">🚀 검색 실행</button>
    </div>
    <div style="font-size:11px;color:var(--text-dim);margin-top:8px">⏱ 응답까지 평균 30초+ 소요. PROD End Point는 더 오래 걸릴 수 있습니다.</div>
  </div>

  <!-- 상태 표시 -->
  <div id="status"></div>

  <!-- 결과 영역 -->
  <div id="resultsSection" class="results-section">

    <!-- KPI -->
    <div class="kpi-grid" id="kpiGrid"></div>

    <!-- 설정 메타 -->
    <div class="section">
      <h2>⚙️ 호출 설정</h2>
      <div class="config-row" id="configRow"></div>
    </div>

    <!-- 응답 텍스트 -->
    <div class="section">
      <h2>🤖 End Point 응답 <small id="textLenLabel"></small></h2>
      <div class="response-text" id="responseText"></div>
    </div>

    <!-- 검색 결과 카드 -->
    <div class="section">
      <h2>📚 검색 결과 (search_results) <small id="searchCountLabel"></small></h2>
      <div id="searchResults"></div>
    </div>

    <!-- Raw JSON -->
    <details>
      <summary>📋 Raw JSON 응답 (펼치기)</summary>
      <div class="raw-json" id="rawJson"></div>
    </details>
  </div>
</div>

<script>
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function setStatus(type, message) {
  var el = document.getElementById('status');
  if (!type) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="status ' + type + '">' + escapeHtml(message) + '</div>';
}

async function runProbe() {
  var query = document.getElementById('queryInput').value.trim();
  if (!query) {
    setStatus('error', '질의를 입력하세요');
    return;
  }

  var env = document.getElementById('envSelect').value;
  var srcWeb = document.getElementById('srcWeb').checked;
  var srcPubmed = document.getElementById('srcPubmed').checked;
  var graphType = document.getElementById('graphType').value.trim();

  var sourceTypes = [];
  if (srcWeb) sourceTypes.push('WEB');
  if (srcPubmed) sourceTypes.push('PUBMED');

  var body = { query: query };
  if (env) body.env = env;
  if (sourceTypes.length > 0) body.sourceTypes = sourceTypes;
  if (graphType) body.graphType = graphType;

  var btn = document.getElementById('btnRun');
  btn.disabled = true;
  btn.textContent = '⏳ 호출 중... (최대 5분)';
  setStatus('loading', '🔄 End Point 호출 중... 응답이 도착하면 결과가 표시됩니다.');
  document.getElementById('resultsSection').style.display = 'none';

  var startTime = Date.now();

  try {
    var res = await fetch('/api/admin/search-probe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    var data = await res.json();
    var elapsedSec = ((Date.now() - startTime) / 1000).toFixed(1);

    if (!res.ok) {
      setStatus('error', '오류: ' + (data.error || res.statusText));
      return;
    }
    if (data.error) {
      setStatus('error', 'End Point 오류: ' + data.error);
    } else {
      setStatus('success', '✓ 호출 성공 (' + elapsedSec + '초 소요, 인용 ' + data.citation_count + '건)');
    }
    renderResults(data);
  } catch(e) {
    setStatus('error', '네트워크 오류: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '🚀 검색 실행';
  }
}

function renderResults(data) {
  document.getElementById('resultsSection').style.display = 'block';

  // KPI
  var kpiHtml = '';
  kpiHtml += '<div class="kpi-card"><div class="kpi-value" style="color:#22c55e">' + (data.http_status || '?') + '</div><div class="kpi-label">HTTP Status</div></div>';
  kpiHtml += '<div class="kpi-card"><div class="kpi-value" style="color:#0ea5e9">' + (data.citation_count || 0) + '</div><div class="kpi-label">검색 결과 수</div></div>';
  kpiHtml += '<div class="kpi-card"><div class="kpi-value" style="color:#a855f7">' + ((data.text || '').length) + '</div><div class="kpi-label">응답 길이 (자)</div></div>';
  kpiHtml += '<div class="kpi-card"><div class="kpi-value" style="color:#eab308">' + ((data.first_token_ms || 0) / 1000).toFixed(1) + 's</div><div class="kpi-label">TTFT (첫 토큰)</div></div>';
  kpiHtml += '<div class="kpi-card"><div class="kpi-value" style="color:#f97316">' + ((data.elapsed_ms || 0) / 1000).toFixed(1) + 's</div><div class="kpi-label">총 응답 시간</div></div>';
  kpiHtml += '<div class="kpi-card"><div class="kpi-value" style="color:' + (data.stopped ? '#22c55e' : '#ef4444') + '">' + (data.stopped ? '✓' : '✗') + '</div><div class="kpi-label">정상 종료</div></div>';
  document.getElementById('kpiGrid').innerHTML = kpiHtml;

  // 설정 메타
  var cfg = data.config || {};
  var cfgHtml = '';
  cfgHtml += '<span><b>env</b>: ' + escapeHtml(cfg.env || '?') + '</span>';
  cfgHtml += '<span><b>api_url</b>: ' + escapeHtml(cfg.api_url || '?') + '</span>';
  cfgHtml += '<span><b>graph_type</b>: ' + escapeHtml(cfg.graph_type || '?') + '</span>';
  cfgHtml += '<span><b>source_types</b>: ' + escapeHtml((cfg.source_types || []).join(', ')) + '</span>';
  cfgHtml += '<span><b>tenant_domain</b>: ' + escapeHtml(cfg.tenant_domain || '?') + '</span>';
  document.getElementById('configRow').innerHTML = cfgHtml;

  // 응답 텍스트
  document.getElementById('responseText').textContent = data.text || '(응답 없음)';
  document.getElementById('textLenLabel').textContent = (data.text || '').length + ' 자';

  // 검색 결과 카드
  var sr = data.search_results || [];
  document.getElementById('searchCountLabel').textContent = sr.length + ' 건';
  var srHtml = '';
  if (sr.length === 0) {
    srHtml = '<div class="empty">검색 결과가 없습니다</div>';
  } else {
    for (var i = 0; i < sr.length; i++) {
      var s = sr[i] || {};
      var title = s.title || '(제목 없음)';
      var authors = Array.isArray(s.authors) ? s.authors.join(', ') : (s.authors || '');
      var year = s.year || s.date || '';
      var doi = s.doi || '';
      var url = s.url || s.pdf_url || '';
      var srcType = (s.source_type || s.source || 'OTHER').toUpperCase();
      var abstract = s.abstract || s.text_snapshot || '';
      srHtml += '<div class="search-card">' +
        '<div class="sc-header">' +
          '<span class="sc-num">#' + (i+1) + '</span>' +
          '<span class="sc-title">' + escapeHtml(title) + '</span>' +
          '<span class="source-pill ' + (srcType === 'PUBMED' || srcType === 'WEB' ? srcType : 'OTHER') + '">' + escapeHtml(srcType) + '</span>' +
        '</div>' +
        '<div class="sc-meta">' +
          (authors ? '<span>👥 ' + escapeHtml(authors.substring(0, 150)) + (authors.length > 150 ? '...' : '') + '</span>' : '') +
          (year ? '<span>📅 ' + escapeHtml(String(year)) + '</span>' : '') +
          (doi ? '<span>🔗 DOI: ' + escapeHtml(doi) + '</span>' : '') +
        '</div>' +
        (abstract ? '<div class="sc-abstract">' + escapeHtml(abstract.substring(0, 500)) + (abstract.length > 500 ? '...' : '') + '</div>' : '') +
        (url ? '<div style="margin-top:6px"><a class="sc-link" href="' + escapeHtml(url) + '" target="_blank">🌐 ' + escapeHtml(url) + '</a></div>' : '') +
        '</div>';
    }
  }
  document.getElementById('searchResults').innerHTML = srHtml;

  // Raw JSON
  document.getElementById('rawJson').textContent = JSON.stringify(data, null, 2);
}

// Enter on query → run
document.getElementById('queryInput').addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'Enter') runProbe();
});
</script>

</body>
</html>
