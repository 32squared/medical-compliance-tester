<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자문 판정 뷰어 — 나만의 주치의</title>
<style>
  :root {
    --bg:#0f1115; --surface:#171a21; --surface2:#1e222b; --border:#2a2f3a;
    --text:#e6e8ec; --text-dim:#8b93a1; --accent:#5b9cf8; --accent-dim:#1b2b45;
    --green:#4caf7d; --amber:#d4a24a; --red:#e05a4f;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:'Malgun Gothic','맑은 고딕',system-ui,sans-serif; font-size:13px; }
  .topbar { display:flex; align-items:center; gap:10px; padding:8px 14px;
            background:var(--surface); border-bottom:1px solid var(--border);
            position:sticky; top:0; z-index:10; }
  .topbar h1 { font-size:15px; margin:0; font-weight:700; }
  .nav-btn { color:var(--text-dim); text-decoration:none; font-size:12px; padding:4px 9px; border-radius:6px; }
  .nav-btn:hover { background:var(--surface2); color:var(--text); }
  .nav-btn.active { background:var(--accent-dim); color:var(--accent); }
  .spacer { margin-left:auto; }

  .layout { display:grid; grid-template-columns:230px 1fr; gap:14px; padding:14px; max-width:1600px; margin:0 auto; }
  @media (max-width:900px) { .layout { grid-template-columns:1fr; } }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .card h2 { font-size:12px; margin:0 0 9px; font-weight:700; color:var(--text-dim); }

  .side { position:sticky; top:56px; align-self:start; max-height:calc(100vh - 70px); overflow:auto; }
  .adv { display:flex; align-items:center; gap:6px; padding:7px 9px; border-radius:7px; cursor:pointer;
         border:1px solid transparent; margin-bottom:3px; }
  .adv:hover { background:var(--surface2); }
  .adv.on { background:var(--accent-dim); border-color:var(--accent); }
  .adv .nm { flex:1; font-size:12px; }
  .adv .ct { font-size:11px; color:var(--text-dim); }
  .adv .bad { font-size:11px; color:var(--red); font-weight:700; }

  .stat { display:flex; gap:8px; flex-wrap:wrap; }
  .stat div { background:var(--surface2); border:1px solid var(--border); border-radius:8px;
              padding:7px 11px; min-width:88px; }
  .stat .k { font-size:10.5px; color:var(--text-dim); }
  .stat .v { font-size:17px; font-weight:700; margin-top:2px; }

  table.sum { width:100%; border-collapse:collapse; font-size:12px; }
  table.sum th, table.sum td { padding:5px 7px; border-bottom:1px solid var(--border); text-align:left; }
  table.sum th { color:var(--text-dim); font-weight:600; font-size:11px; background:var(--surface2); }
  table.sum td.n { text-align:right; }

  .filters { display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
  .filters select, .filters input {
    background:var(--surface2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 8px; font-size:12px; font-family:inherit; }
  .filters input[type=search] { min-width:210px; }
  .chip { font-size:11.5px; padding:4px 9px; border-radius:14px; cursor:pointer;
          border:1px solid var(--border); background:var(--surface2); color:var(--text-dim); }
  .chip.on { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }

  .rev { background:var(--surface); border:1px solid var(--border); border-radius:10px;
         padding:0; margin-bottom:11px; overflow:hidden; }
  .rev.has-bad { border-color:#4a2b2b; }
  .rev-head { display:flex; align-items:center; gap:8px; padding:9px 13px;
              background:var(--surface2); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .rev-head .case { font-weight:700; font-size:12.5px; }
  .rev-head .who { font-size:11.5px; color:var(--text-dim); }
  .rev-head .when { font-size:11px; color:var(--text-dim); margin-left:auto; }
  .rev-body { padding:11px 13px; }

  .qa { margin-bottom:10px; }
  .qa .lbl { font-size:10.5px; color:var(--text-dim); margin-bottom:3px; }
  .q { background:var(--accent-dim); border-left:3px solid var(--accent); border-radius:0 7px 7px 0;
       padding:8px 11px; font-size:13px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .a { background:var(--bg); border:1px solid var(--border); border-radius:7px;
       padding:9px 11px; font-size:12.5px; line-height:1.65; white-space:pre-wrap; word-break:break-word;
       max-height:260px; overflow:auto; }
  .a.full { max-height:none; }
  .more { font-size:11px; color:var(--accent); cursor:pointer; margin-top:4px; display:inline-block; }

  .items { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:7px; margin-top:9px; }
  .it { border:1px solid var(--border); border-radius:7px; padding:7px 9px; background:var(--surface2); }
  .it.bad { border-color:var(--red); background:#241a19; }
  .it.na { opacity:.5; }
  .it .nm { font-size:11px; color:var(--text-dim); margin-bottom:3px; }
  .it .vd { font-size:12px; font-weight:700; }
  .it .vd.ok { color:var(--green); } .it .vd.bad { color:var(--red); } .it .vd.na { color:var(--text-dim); }
  .it .note { font-size:11.5px; margin-top:5px; line-height:1.5; }
  .it .sug { font-size:11.5px; margin-top:4px; line-height:1.5; color:var(--green);
             border-top:1px dashed var(--border); padding-top:4px; }
  .it b { color:var(--text-dim); font-weight:600; }

  .overall { margin-top:9px; padding:8px 10px; border-radius:7px;
             background:var(--surface2); border:1px solid var(--border); font-size:12px; line-height:1.55; }
  .tagx { font-size:10.5px; padding:2px 7px; border-radius:10px;
          border:1px solid var(--amber); color:var(--amber); }
  .muted { color:var(--text-dim); }
  .empty { padding:30px; text-align:center; color:var(--text-dim); }
  .gate { max-width:520px; margin:70px auto; }
</style>
</head>
<body>

<div class="topbar">
  <h1>&#128203; 자문 판정 뷰어</h1>
  <a href="/" class="nav-btn">채팅 테스터</a>
  <a href="/phr" class="nav-btn">PHR 케이스</a>
  <a href="/advisory" class="nav-btn active">자문 판정</a>
  <span class="spacer"></span>
  <a href="/api/advisory/export" class="nav-btn">엑셀 내려받기</a>
</div>

<div id="gate" class="gate card" style="display:none">
  <h2>관리자 전용</h2>
  <p class="muted">자문위원 전체의 판정을 모아 보는 화면이라 관리자 로그인이 필요합니다.</p>
  <p><a href="/settings" class="nav-btn" style="border:1px solid var(--border)">설정에서 로그인</a></p>
</div>

<div id="main" class="layout" style="display:none">
  <div class="side">
    <div class="card">
      <h2>자문위원</h2>
      <div id="advList"></div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>진행 요약</h2>
      <div class="stat" id="stat"></div>
    </div>

    <div class="card">
      <h2>항목별 판정</h2>
      <table class="sum">
        <thead><tr><th>항목</th><th class="n">적정</th><th class="n">부적정</th><th class="n">해당없음</th><th class="n">부적정률</th></tr></thead>
        <tbody id="sumBody"></tbody>
      </table>
    </div>

    <div class="card">
      <div class="filters">
        <span class="chip on" id="chipAll">전체</span>
        <span class="chip" id="chipBad">부적정만</span>
        <select id="fItem"><option value="">항목 전체</option></select>
        <select id="fCase"><option value="">케이스 전체</option></select>
        <input type="search" id="fQ" placeholder="질문·답변·사유 검색">
        <span class="muted" id="cnt"></span>
      </div>
    </div>

    <div id="list"></div>
  </div>
</div>

<script>
var ITEMS = [
  ['screeningExplanation', '1. 검진결과 설명'],
  ['trendGuidance',        '2. 수치변화 안내'],
  ['emergencyGuidance',    '3. 응급 안내'],
  ['reassuranceLimit',     '4. 안심 한계'],
  ['specialtyAppropriate', '5. 분과 적절성']
];
var ALL = [], CURRENT = '', BAD_ONLY = false;
// 판정의 specialty 는 '문항의 분과' 라서 교차 배정 케이스에서는 판정자의 분과와 다르다.
// (영상의학 위원이 소화기 시트 케이스를 판정하는 식) 판정자 라벨은 최빈 분과로 잡는다.
var OWN_SPEC = {};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function badCount(r) {
  var n = 0, its = r.items || {};
  for (var k in its) { if (its[k] && its[k].verdict === '부적정') n++; }
  return n;
}

async function boot() {
  var res = null;
  try { res = await fetch('/api/advisory/reviews'); } catch (e) { res = null; }
  if (!res || !res.ok) { document.getElementById('gate').style.display = ''; return; }
  var data = await res.json();
  ALL = (data.reviews || []).slice().sort(function (a, b) {
    return String(a.reviewerId).localeCompare(String(b.reviewerId)) ||
           String(a.caseNo).localeCompare(String(b.caseNo)) ||
           String(a.createdAt).localeCompare(String(b.createdAt));
  });

  // 관리자가 아니면 서버가 본인 판정만 돌려준다. 이 화면은 전체 대조가 목적이라 막는다.
  var st = {};
  try { st = await (await fetch('/api/auth/status')).json(); } catch (e) { st = {}; }
  if (!st.isAdmin) { document.getElementById('gate').style.display = ''; return; }

  document.getElementById('main').style.display = '';
  var fi = document.getElementById('fItem');
  ITEMS.forEach(function (p) {
    var o = document.createElement('option'); o.value = p[0]; o.textContent = p[1]; fi.appendChild(o);
  });
  fi.onchange = render;
  document.getElementById('fCase').onchange = render;
  document.getElementById('fQ').oninput = render;
  document.getElementById('chipAll').onclick = function () { setBadOnly(false); };
  document.getElementById('chipBad').onclick = function () { setBadOnly(true); };
  buildSide();
  render();
}

function buildSide() {
  var by = {};
  ALL.forEach(function (r) {
    var k = r.reviewerId || '?';
    if (!by[k]) by[k] = { spec: {}, n: 0, bad: 0 };
    by[k].n++; by[k].bad += badCount(r);
    if (r.specialty) by[k].spec[r.specialty] = (by[k].spec[r.specialty] || 0) + 1;
  });
  OWN_SPEC = {};
  Object.keys(by).forEach(function (id) {
    var m = '', best = -1;
    Object.keys(by[id].spec).forEach(function (sp) {
      if (by[id].spec[sp] > best) { best = by[id].spec[sp]; m = sp; }
    });
    OWN_SPEC[id] = m;
  });
  var box = document.getElementById('advList');
  box.innerHTML = '';
  function mk(id, label, sub, n, bad, on) {
    var d = document.createElement('div');
    d.className = 'adv' + (on ? ' on' : '');
    d.innerHTML = '<span class="nm">' + esc(label) +
                  (sub ? '<br><span style="font-size:10px;color:var(--text-dim)">' + esc(sub) + '</span>' : '') +
                  '</span><span class="ct">' + n + '</span>' +
                  (bad ? '<span class="bad">' + bad + '</span>' : '');
    d.onclick = function () { CURRENT = id; buildSide(); render(); };
    box.appendChild(d);
  }
  var totalBad = 0;
  ALL.forEach(function (r) { totalBad += badCount(r); });
  mk('', '전체', '', ALL.length, totalBad, CURRENT === '');
  Object.keys(by).sort().forEach(function (id) {
    mk(id, OWN_SPEC[id] || id, id, by[id].n, by[id].bad, CURRENT === id);
  });
}

function filtered() {
  var item = document.getElementById('fItem').value;
  var cs = document.getElementById('fCase').value;
  var q = (document.getElementById('fQ').value || '').trim().toLowerCase();
  return ALL.filter(function (r) {
    if (CURRENT && r.reviewerId !== CURRENT) return false;
    if (cs && r.caseNo !== cs) return false;
    if (BAD_ONLY && !badCount(r)) return false;
    var its = r.items || {};
    if (item) {
      var v = its[item];
      if (!v) return false;
      if (BAD_ONLY && v.verdict !== '부적정') return false;
    }
    if (q) {
      var parts = [r.query || '', r.response || '', r.overallNote || ''];
      for (var k in its) {
        if (its[k]) parts.push((its[k].note || '') + ' ' + (its[k].suggested || ''));
      }
      if (parts.join(' ').toLowerCase().indexOf(q) < 0) return false;
    }
    return true;
  });
}

function st(k, v) {
  return '<div><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div>';
}

function render() {
  var rows = filtered();
  document.getElementById('cnt').textContent = rows.length + '건';

  // 케이스 선택지는 지금 고른 자문위원 기준으로 다시 만든다
  var sel = document.getElementById('fCase'), keep = sel.value, seen = {};
  ALL.forEach(function (r) {
    if ((!CURRENT || r.reviewerId === CURRENT) && r.caseNo) seen[r.caseNo] = 1;
  });
  var cases = Object.keys(seen).sort();
  sel.innerHTML = '<option value="">케이스 전체</option>' + cases.map(function (c) {
    return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
  }).join('');
  if (cases.indexOf(keep) >= 0) sel.value = keep;

  var scope = ALL.filter(function (r) { return !CURRENT || r.reviewerId === CURRENT; });
  var caseSet = {}, ok = 0, bad = 0, nBad = 0;
  scope.forEach(function (r) {
    caseSet[r.caseId] = 1;
    nBad += badCount(r);
    var its = r.items || {};
    for (var k in its) {
      if (!its[k]) continue;
      if (its[k].verdict === '적정') ok++;
      else if (its[k].verdict === '부적정') bad++;
    }
  });
  var rate = (ok + bad) ? Math.round(ok * 100 / (ok + bad)) : 0;
  document.getElementById('stat').innerHTML =
    st('판정 레코드', scope.length) + st('케이스', Object.keys(caseSet).length) +
    st('적정', ok) + st('부적정', nBad) + st('적정률', rate + '%');

  var agg = {};
  ITEMS.forEach(function (p) { agg[p[0]] = { '적정': 0, '부적정': 0, '해당없음': 0 }; });
  scope.forEach(function (r) {
    var its = r.items || {};
    for (var k in its) {
      if (agg[k] && its[k] && agg[k][its[k].verdict] !== undefined) agg[k][its[k].verdict]++;
    }
  });
  document.getElementById('sumBody').innerHTML = ITEMS.map(function (p) {
    var a = agg[p[0]], j = a['적정'] + a['부적정'];
    var pr = j ? Math.round(a['부적정'] * 100 / j) : 0;
    return '<tr><td>' + esc(p[1]) + '</td><td class="n">' + a['적정'] + '</td>' +
      '<td class="n" style="color:' + (a['부적정'] ? 'var(--red)' : 'inherit') + '">' + a['부적정'] + '</td>' +
      '<td class="n muted">' + a['해당없음'] + '</td>' +
      '<td class="n" style="color:' + (pr >= 10 ? 'var(--red)' : 'inherit') + '">' + pr + '%</td></tr>';
  }).join('');

  var box = document.getElementById('list');
  if (!rows.length) { box.innerHTML = '<div class="card empty">조건에 맞는 판정이 없습니다</div>'; return; }
  box.innerHTML = '';
  rows.forEach(function (r) { box.appendChild(cardEl(r)); });
}

function cardEl(r) {
  var its = r.items || {}, nb = badCount(r);
  var wrap = document.createElement('div');
  wrap.className = 'rev' + (nb ? ' has-bad' : '');

  var head = document.createElement('div');
  head.className = 'rev-head';
  var own = OWN_SPEC[r.reviewerId] || '';
  var cross = r.specialty && own && r.specialty !== own;
  head.innerHTML =
    '<span class="case">' + esc(r.caseNo || r.caseId || '-') + '</span>' +
    '<span class="who">' + esc(own || r.specialty || '') + ' · ' + esc(r.reviewerId || '') + '</span>' +
    (cross ? '<span class="tagx">' + esc(r.specialty) + ' 문항</span>' : '') +
    (nb ? '<span style="color:var(--red);font-weight:700;font-size:11.5px">부적정 ' + nb + '</span>' : '') +
    '<span class="when">' + esc(String(r.createdAt || '').slice(0, 16).replace('T', ' ')) + '</span>';
  wrap.appendChild(head);

  var body = document.createElement('div');
  body.className = 'rev-body';

  var qa = document.createElement('div');
  qa.className = 'qa';
  qa.innerHTML = '<div class="lbl">질문</div><div class="q">' + esc(r.query || '(기록 없음)') + '</div>';
  body.appendChild(qa);

  var ab = document.createElement('div');
  ab.className = 'qa';
  ab.innerHTML = '<div class="lbl">답변</div>';
  var ans = document.createElement('div');
  ans.className = 'a';
  ans.textContent = r.response || '(기록 없음)';
  ab.appendChild(ans);
  var more = document.createElement('span');
  more.className = 'more';
  more.textContent = '전체 보기';
  // innerHTML 에 JSON 을 끼워 넣지 않고 클로저로 붙인다
  more.onclick = function () {
    ans.classList.toggle('full');
    more.textContent = ans.classList.contains('full') ? '접기' : '전체 보기';
  };
  ab.appendChild(more);
  body.appendChild(ab);

  var grid = document.createElement('div');
  grid.className = 'items';
  grid.innerHTML = ITEMS.map(function (p) {
    var v = its[p[0]];
    if (!v) return '';
    var vd = v.verdict || '미기재';
    var cls = vd === '부적정' ? 'bad' : (vd === '해당없음' ? 'na' : 'ok');
    return '<div class="it ' + (vd === '부적정' ? 'bad' : (vd === '해당없음' ? 'na' : '')) + '">' +
      '<div class="nm">' + esc(p[1]) + '</div>' +
      '<div class="vd ' + cls + '">' + esc(vd) + '</div>' +
      (v.note ? '<div class="note"><b>사유</b> ' + esc(v.note) + '</div>' : '') +
      (v.suggested ? '<div class="sug"><b>수정안</b> ' + esc(v.suggested) + '</div>' : '') +
      '</div>';
  }).join('');
  body.appendChild(grid);

  if (r.overallNote) {
    var ov = document.createElement('div');
    ov.className = 'overall';
    ov.innerHTML = '<span class="muted">총평</span> ' + esc(r.overallNote);
    body.appendChild(ov);
  }

  wrap.appendChild(body);
  return wrap;
}

function setBadOnly(v) {
  BAD_ONLY = v;
  document.getElementById('chipAll').className = 'chip' + (v ? '' : ' on');
  document.getElementById('chipBad').className = 'chip' + (v ? ' on' : '');
  render();
}

boot();
</script>
</body>
</html>
